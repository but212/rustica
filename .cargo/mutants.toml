# Feature-gated code (e.g. serde impls) must be compiled for its mutants to be testable.
all_features = true

# Equivalent mutants: not observable through the public API.
exclude_re = [
  # Capacity-only arithmetic.
  'replace \* with [/+] in ContextError<E>::error_chain',
  'replace (> with >=|- with [+/]) in NonEmptyErrors<E>::combine_multiple',
  # Self::new() == Default::default() for Vec and String.
  'replace <impl Monoid for (Vec<T>|String)>::empty -> Self with Default::default\(\)',
]
