[package]
name = "rustica"
version = "0.18.0"
authors = ["jeong-il suk <wjddlf211@naver.com>"]
edition = "2024"
rust-version = "1.88.0"
description = "Rustica is a functional programming library for the Rust language."
license = "Apache-2.0"
repository = "https://github.com/but212/rustica"
readme = "README.md"
keywords = ["functional", "data-structures"]
categories = ["data-structures"]
documentation = "https://docs.rs/rustica"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
smallvec = "1.14.0"
quickcheck = { version = "1.0", optional = true }
serde = { version = "1.0", optional = true, features = ["derive"] }

[dev-dependencies]
# Deprecated in 0.19.0: tokio is used only for Validated async combinator unit tests; scheduled for removal in 0.20.0
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
quickcheck = "1.0"
quickcheck_macros = "1.0"
serde_json = "1.0"

[features]
default = []
serde = ["dep:serde", "smallvec/serde", "serde/rc"]
# Deprecated in 0.19.0: async combinators are scheduled for removal in 0.20.0 in favor of native async/await
async = []
quickcheck = ["dep:quickcheck"]
# Note: async feature will be dropped from full bundle in 0.20.0
full = ["async", "serde", "quickcheck"]
develop = ["full"]

[[bench]]
name = "datatypes_benchmarks"
harness = false
