name: Rust CI/CD

on:
  push:
    branches: [main, develop]
    tags:
      - "v*"
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    permissions:
      contents: read
    uses: ./.github/workflows/ci-quality.yml

  tests:
    name: Tests
    permissions:
      contents: read
    uses: ./.github/workflows/ci-tests.yml

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, tests]
    permissions:
      contents: write # required by the release job after crates.io approval
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/publish-release.yml
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  benchmarks:
    name: Benchmarks
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [quality, tests]
    permissions:
      contents: read
    uses: ./.github/workflows/benchmarks.yml

  benchmark_baseline:
    name: Update benchmark baseline
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [benchmarks]
    permissions:
      contents: write # required to update the gh-pages baseline
      actions: read # required to download the benchmark artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download benchmark artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: benchmark-results

      - name: Update gh-pages baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/benchmark_baseline.py benchmark-results/formatted_benchmark_results.json
