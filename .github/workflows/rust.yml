name: Rust CI/CD

on:
  push:
    branches: [main, develop]
    tags:
      - "v*"
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    permissions:
      contents: read
    uses: ./.github/workflows/ci-quality.yml

  tests:
    name: Tests
    permissions:
      contents: read
    uses: ./.github/workflows/ci-tests.yml

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, tests]
    permissions:
      contents: write # required by the release job after crates.io approval
      id-token: write # required by crates.io Trusted Publishing
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/publish-release.yml

  provenance:
    name: SLSA Provenance
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    permissions:
      actions: read # required by the SLSA generator reusable workflow
      id-token: write # required to sign the provenance
      contents: write # required to upload provenance to the release
    concurrency:
      group: slsa-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/generator-generic-ossf-slsa3-publish.yml
    with:
      tag_name: ${{ github.ref_name }}
