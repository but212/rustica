name: Rust CI/CD

on:
  push:
    branches: [main, develop]
    tags:
      - "v*"
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    permissions:
      contents: read
    uses: ./.github/workflows/ci-quality.yml

  tests:
    name: Tests
    permissions:
      contents: read
    uses: ./.github/workflows/ci-tests.yml

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, tests]
    permissions:
      contents: write # required by the release job after crates.io approval
      id-token: write # required by crates.io Trusted Publishing
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/publish-release.yml
