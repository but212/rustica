name: CI Tests

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings -A deprecated"
  NIGHTLY_TOOLCHAIN: nightly-2026-08-20

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }} (${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: ""
          - os: windows-latest
            features: ""
          - os: macos-latest
            features: ""
          - os: ubuntu-latest
            features: "--all-features"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run tests
        env:
          FEATURES: ${{ matrix.features }}
        shell: bash
        run: |
          if [ -n "$FEATURES" ]; then
            cargo test "$FEATURES" --locked --verbose
          else
            cargo test --locked --verbose
          fi

  msrv:
    name: Test declared MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable for metadata
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Check all features on MSRV
        shell: bash
        run: |
          set -euo pipefail
          MSRV="$(cargo metadata --no-deps --format-version 1 --locked | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["rust_version"])')"
          echo "Testing with MSRV: $MSRV"
          rustup toolchain install "$MSRV" --profile minimal
          cargo "+$MSRV" check --all-features --locked --verbose
          cargo "+$MSRV" test --all-features --locked --verbose

  nightly:
    name: Test nightly
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run nightly tests
        env:
          TOOLCHAIN: ${{ env.NIGHTLY_TOOLCHAIN }}
        run: cargo "+$TOOLCHAIN" test --all-features --locked --verbose

  unused_dependencies:
    name: Check for unused dependencies
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-udeps
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-udeps

      - name: Run cargo-udeps
        env:
          TOOLCHAIN: ${{ env.NIGHTLY_TOOLCHAIN }}
        run: cargo "+$TOOLCHAIN" udeps --all-targets --all-features --locked

  miri:
    name: Miri transformer ownership
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned nightly with Miri
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          components: miri

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Miri builds a nightly-specific custom sysroot. Reusing target artifacts
          # from another compiler or an older Miri sysroot can hide dependencies.
          cache-targets: false

      - name: Initialize Miri sysroot
        env:
          TOOLCHAIN: ${{ env.NIGHTLY_TOOLCHAIN }}
        run: cargo "+$TOOLCHAIN" miri setup

      - name: Run targeted Miri tests
        env:
          TOOLCHAIN: ${{ env.NIGHTLY_TOOLCHAIN }}
        run: cargo "+$TOOLCHAIN" miri test --test miri_transformers --locked
