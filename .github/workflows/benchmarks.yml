name: Performance Benchmarks

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run benchmarks
        run: cargo bench --all-features --locked

      - name: Build benchmark artifact
        run: |
          python3 - <<'PY'
          import json
          import math
          from pathlib import Path

          root = Path("target/criterion")
          results = []
          for path in root.glob("**/new/estimates.json"):
              relative = path.relative_to(root)
              name = "_".join(relative.parts[:-2])
              estimate = json.loads(path.read_text(encoding="utf-8"))
              value = estimate["mean"]["point_estimate"]
              if not isinstance(value, (int, float)) or not math.isfinite(value) or value <= 0:
                  raise SystemExit(f"Invalid benchmark value in {path}")
              results.append({"name": name, "value": float(value), "unit": "ns/iter"})

          if not results:
              raise SystemExit("No benchmark results were found")
          names = [result["name"] for result in results]
          if len(names) != len(set(names)):
              raise SystemExit("Duplicate benchmark names were found")
          results.sort(key=lambda result: result["name"])
          Path("formatted_benchmark_results.json").write_text(
              json.dumps(results, indent=2) + "\n", encoding="utf-8"
          )
          print(f"Found {len(results)} benchmark(s)")
          PY

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: formatted_benchmark_results.json
          if-no-files-found: error
          retention-days: 30
