name: Benchmarks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: benchmarks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run benchmarks
        shell: bash
        run: |
          cargo bench --bench datatypes_benchmarks --features pvec --locked | tee benchmark_raw.txt

      - name: Generate benchmark report
        run: python3 .github/scripts/benchmark_report.py --input benchmark_raw.txt --output benchmark_report.md

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            benchmark_raw.txt
            benchmark_report.md
          if-no-files-found: error
          retention-days: 30
