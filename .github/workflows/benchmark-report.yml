name: Benchmark Regression Reporter

on:
  workflow_run:
    # This job never checks out or executes PR code; it only reads a JSON artifact.
    # zizmor: ignore[dangerous-triggers]
    workflows: ["Rust CI/CD"]
    types: [completed]

permissions: {}

concurrency:
  group: benchmark-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  report:
    name: Benchmark regression reporter
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].number != 0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # required to download the completed PR benchmark artifact
      pull-requests: write # required to update the benchmark report comment
      checks: write # required to publish the benchmark regression check
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download candidate benchmark artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p candidate
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "benchmark-results-$RUN_ID" \
            --dir candidate

      - name: Compare and report benchmark results
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/benchmark_report.py candidate
