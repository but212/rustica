name: Publish and Release

on:
  workflow_call:
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    outputs:
      version: ${{ steps.package.outputs.version }}
      body: ${{ steps.package.outputs.body }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Read package metadata and CHANGELOG
        id: package
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 --locked | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Version mismatch: tag $TAG_VERSION != Cargo.toml $CARGO_VERSION"
            exit 1
          fi
          python3 .github/scripts/release_metadata.py "$CARGO_VERSION" > release-notes.md
          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "body<<CHANGELOG_BODY"
            cat release-notes.md
            echo "CHANGELOG_BODY"
          } >> "$GITHUB_OUTPUT"

      - name: Verify package
        run: cargo package --locked --all-features

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --all-features

  release:
    name: Create GitHub Release
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # required to create the GitHub release
    steps:
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_BODY: ${{ needs.publish.outputs.body }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_BODY" > release-notes.md
          gh release create "v$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Release v$RELEASE_VERSION" \
            --notes-file release-notes.md
