name: Publish and Release

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    outputs:
      version: ${{ steps.package.outputs.version }}
      body: ${{ steps.package.outputs.body }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write # required by crates.io Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Read package metadata and CHANGELOG
        id: package
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 --locked | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Version mismatch: tag $TAG_VERSION != Cargo.toml $CARGO_VERSION"
            exit 1
          fi
          RELEASE_NOTES="$RUNNER_TEMP/release-notes.md"
          python3 .github/scripts/release_metadata.py "$CARGO_VERSION" > "$RELEASE_NOTES"
          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "body<<CHANGELOG_BODY"
            cat "$RELEASE_NOTES"
            echo "CHANGELOG_BODY"
          } >> "$GITHUB_OUTPUT"

      - name: Verify package
        run: cargo package --locked --all-features

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish --locked --all-features

  release:
    name: Create GitHub Release
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # required to create the GitHub release
    steps:
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_BODY: ${{ needs.publish.outputs.body }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_BODY" > release-notes.md
          gh release create "v$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Release v$RELEASE_VERSION" \
            --notes-file release-notes.md
