name: SLSA Provenance Generator

on:
  workflow_dispatch:
  release:
    types: [created, published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.hashes }}
      crate_name: ${{ steps.package.outputs.crate_name }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - uses: Swatinem/rust-cache@v2
      
      - name: Create .crate package
        id: package
        run: |
          set -euo pipefail
          
          # Package the crate (same artifact that goes to crates.io)
          cargo package --all-features
          
          # Find the generated .crate file
          CRATE_FILE=$(find target/package -name "*.crate" -type f | head -1)
          
          if [ -z "$CRATE_FILE" ]; then
            echo "::error::No .crate file found after cargo package"
            exit 1
          fi
          
          CRATE_NAME=$(basename "$CRATE_FILE")
          echo "crate_name=$CRATE_NAME" >> $GITHUB_OUTPUT
          
          # Create artifacts directory
          mkdir -p release-artifacts
          cp "$CRATE_FILE" release-artifacts/
          
          echo "Created package: $CRATE_NAME"
          ls -la release-artifacts/

      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail
          
          cd release-artifacts
          
          # Find .crate file (the actual distributable for Rust libraries)
          CRATE_FILE=$(find . -name "*.crate" -type f | head -1)
          
          if [ -z "$CRATE_FILE" ]; then
            echo "::error::No .crate artifact found"
            exit 1
          fi
          
          # Generate SHA256 hash (base64 encoded for SLSA)
          echo "hashes=$(sha256sum $CRATE_FILE | base64 -w0)" >> $GITHUB_OUTPUT
          
          echo "Generated checksum for SLSA provenance:"
          sha256sum $CRATE_FILE

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustica-slsa-artifacts
          path: release-artifacts/*.crate
          retention-days: 5

  # The SLSA provenance generator job
  provenance:
    needs: [build]
    permissions:
      actions: read   # To read the workflow path
      id-token: write # To sign the provenance
      contents: write # To add assets to a release
    
    # Using the latest version (v2.1.0) of the SLSA generator
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true # Upload provenance to the GitHub release
      
  # Verification job to ensure provenance is correctly generated and verifiable
  verify:
    needs: [provenance]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
      - name: Install SLSA verifier
        run: |
          curl -fsSL https://github.com/slsa-framework/slsa-verifier/releases/download/v2.4.0/slsa-verifier-linux-amd64 -o slsa-verifier
          chmod +x slsa-verifier
          ./slsa-verifier --version
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: rustica-slsa-artifacts
          path: ./artifacts
      
      - name: Download provenance
        run: |
          # Get the provenance file from the release
          gh release download ${{ github.ref_name }} -p "*.intoto.*" -D ./provenance
        env:
          GH_TOKEN: ${{ github.token }}
      
      - name: Verify provenance
        run: |
          for artifact in ./artifacts/*.crate; do
            echo "Verifying provenance for $artifact"
            ./slsa-verifier verify-artifact \
              --provenance-path="./provenance/*.intoto.jsonl" \
              --source-uri="github.com/${{ github.repository }}" \
              --source-tag=${{ github.ref_name }} \
              "$artifact"
          done