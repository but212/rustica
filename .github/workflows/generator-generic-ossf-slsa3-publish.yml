name: SLSA Provenance Generator

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: slsa-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build crate subject
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digests: ${{ steps.hash.outputs.hashes }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Create .crate package
        shell: bash
        run: |
          set -euo pipefail
          cargo package --locked --all-features
          mapfile -t CRATE_FILES < <(find target/package -name "*.crate" -type f -print)
          if [ "${#CRATE_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .crate file, found ${#CRATE_FILES[@]}"
            printf '  %s\n' "${CRATE_FILES[@]}"
            exit 1
          fi
          mkdir -p release-artifacts
          cp -- "${CRATE_FILES[0]}" release-artifacts/

      - name: Generate subject for provenance
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CRATE_FILES < <(find release-artifacts -name "*.crate" -type f -print)
          if [ "${#CRATE_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .crate artifact, found ${#CRATE_FILES[@]}"
            exit 1
          fi
          CRATE_FILE="${CRATE_FILES[0]}"
          echo "hashes=$(sha256sum -- "$CRATE_FILE" | base64 -w0)" >> "$GITHUB_OUTPUT"
          sha256sum -- "$CRATE_FILE"

      - name: Upload crate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rustica-slsa-artifacts
          path: release-artifacts/*.crate
          if-no-files-found: error
          retention-days: 5

  provenance:
    name: Generate SLSA provenance
    needs: [build]
    permissions:
      actions: read # required by the SLSA generator reusable workflow
      id-token: write # required to sign the provenance
      contents: write # required to upload provenance to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.digests }}
      upload-assets: true

  verify:
    name: Verify SLSA provenance
    needs: [provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # required to download the crate artifact
    steps:
      - name: Download SLSA verifier
        shell: bash
        run: |
          set -euo pipefail
          VERIFIER_VERSION="2.4.0"
          curl -fsSL --retry 3 \
            "https://github.com/slsa-framework/slsa-verifier/releases/download/v${VERIFIER_VERSION}/slsa-verifier-linux-amd64" \
            -o slsa-verifier
          echo "9883E4C7FD0FEAD95815DE1533DB62D1AE19DAF9D333B359E192FC65FFB401B2  slsa-verifier" | sha256sum --check --status
          chmod +x slsa-verifier
          ./slsa-verifier --version | grep -F "$VERIFIER_VERSION" > /dev/null

      - name: Download crate artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rustica-slsa-artifacts
          path: artifacts

      - name: Download provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" -p "*.intoto.jsonl" -D provenance

      - name: Verify provenance
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mapfile -t PROVENANCE_FILES < <(find provenance -name "*.intoto.jsonl" -type f -print)
          if [ "${#PROVENANCE_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one provenance file, found ${#PROVENANCE_FILES[@]}"
            exit 1
          fi
          for artifact in artifacts/*.crate; do
            ./slsa-verifier verify-artifact \
              --provenance-path="${PROVENANCE_FILES[0]}" \
              --source-uri="github.com/${GITHUB_REPOSITORY}" \
              --source-tag="$RELEASE_TAG" \
              "$artifact"
          done
